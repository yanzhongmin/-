<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="光位">
<meta name="description" content="拍照前告诉你人站哪儿、摆什么姿势、参数怎么设；拍完按预设调美颜和氛围感。照片不上传。">
<title>光位 · 拍照搭子</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo"></span>
      <b>光位</b>
      <em>拍照搭子</em>
    </div>
    <div class="chips">
      <button id="btnScene" class="chip scene">识别中…</button>
      <button id="btnSubject" class="chip">人物</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <img id="photo" alt="">
    <div class="grade tint" id="tint"></div>
    <div class="grade vig" id="vig"></div>
    <div class="grade grain" id="grain"></div>
    <canvas id="overlay"></canvas>
    <div class="flash" id="flash"></div>

    <div class="coach" id="coach"></div>
    <div class="aim" id="aim"></div>
    <button class="back-cam" id="backCam" hidden>回到相机</button>

    <div class="empty" id="empty">
      <div class="empty-inner">
        <div class="empty-icon">◎</div>
        <p id="emptyMsg">打开相机，站着别动<br>我来告诉你站哪、怎么摆</p>
        <div class="empty-btns">
          <button class="btn primary" id="btnStart">打开相机</button>
          <button class="btn ghost" id="btnPick">先用照片试试</button>
        </div>
      </div>
    </div>
  </section>

  <div class="dock" id="dock">
    <div class="dock-head">
      <div class="tabs" id="tabs">
        <button data-tab="compose" class="on">构图</button>
        <button data-tab="pose">姿势</button>
        <button data-tab="params">参数</button>
        <button data-tab="mood">氛围</button>
      </div>
      <button class="collapse" id="btnCollapse">▾</button>
    </div>

    <div class="panels">
      <div class="panel on" data-panel="compose">
        <div class="rules" id="rules"></div>
        <div class="place">
          <div class="place-left">
            <p class="tip" id="placeTip">等一会儿，正在找最上镜的位置…</p>
            <ul class="reasons" id="placeReasons"></ul>
            <p class="move" id="placeMove"></p>
          </div>
          <div class="place-alts" id="placeAlts"></div>
        </div>
        <p class="meta" id="placeMeta"></p>
      </div>

      <div class="panel" data-panel="pose">
        <div class="cats" id="poseCats"></div>
        <div class="poses" id="poseList"></div>
        <p class="pose-tip" id="poseTip"></p>
      </div>

      <div class="panel" data-panel="params">
        <p class="summary" id="paramSummary"></p>
        <div class="param-grid" id="paramGrid"></div>
        <div class="param-actions">
          <button class="btn ghost" id="btnCopy">复制参数</button>
          <button class="btn primary" id="btnAuto">一键套用</button>
        </div>
      </div>

      <div class="panel" data-panel="mood">
        <div class="moods" id="moodList"></div>
        <div class="slider-row">
          <span>强度</span>
          <input type="range" id="gradeK" min="0" max="100" value="100">
        </div>
        <ul class="mood-tips" id="moodTips"></ul>
      </div>
    </div>
  </div>

  <div class="shutterbar">
    <button class="side" id="btnAlbum">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 17l4.5-4.5 3 3L15 12l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <em>相册</em>
    </button>
    <button class="shutter" id="btnShutter" aria-label="拍照"><span></span></button>
    <button class="side" id="btnFlip">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9a8 8 0 0 1 14-3.5M20 15a8 8 0 0 1-14 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <em>翻转</em>
    </button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<canvas id="shot" hidden></canvas>

<div class="sheet" id="subject">
  <div class="sheet-card">
    <div class="sheet-head">
      <b>今天拍谁</b>
      <button id="subjClose">完成</button>
    </div>
    <div class="field">
      <label>身高 <span id="subjHeightVal">170cm</span></label>
      <input type="range" id="subjHeight" min="140" max="195" value="170">
    </div>
    <div class="field">
      <label>类型</label>
      <div class="seg" id="subjStyle">
        <button data-style="f" class="on">女生</button>
        <button data-style="m">男生</button>
        <button data-style="k">小朋友</button>
        <button data-style="o">长辈</button>
      </div>
    </div>
    <div class="field">
      <label>今天穿的颜色</label>
      <div class="swatches" id="subjColor">
        <button data-color="#efeae1" class="on" style="--c:#efeae1"></button>
        <button data-color="#b9c6d4" style="--c:#b9c6d4"></button>
        <button data-color="#c9553f" style="--c:#c9553f"></button>
        <button data-color="#2f3a4b" style="--c:#2f3a4b"></button>
        <button data-color="#1c1c1e" style="--c:#1c1c1e"></button>
        <button data-color="#d8b45a" style="--c:#d8b45a"></button>
        <button data-color="#4b7a5c" style="--c:#4b7a5c"></button>
      </div>
    </div>
    <div class="field">
      <label>几个人</label>
      <div class="seg" id="subjCount">
        <button data-count="1" class="on">1 人</button>
        <button data-count="2">2 人</button>
        <button data-count="3">3 人</button>
      </div>
    </div>
    <p class="hint">身高和穿搭只会影响推荐的位置和比例，照片不会被上传。</p>
  </div>
</div>

<div class="sheet edit" id="edit">
  <div class="sheet-card edit-card">
    <div class="edit-top">
      <button class="btn ghost sm" id="editAgain">重拍</button>
      <span class="edit-title">拍完再调</span>
      <button class="btn primary sm" id="editShare" hidden>分享</button>
      <button class="btn primary sm" id="editSave">保存</button>
    </div>
    <div class="edit-stage">
      <canvas id="editCanvas"></canvas>
      <div class="edit-busy" id="editBusy">正在处理这张照片…</div>
    </div>
    <div class="edit-body">
      <div class="edit-sec">
        <div class="edit-hd">
          <b>美颜</b>
          <span class="edit-tag" id="editFaceTag">已找到皮肤</span>
          <button class="mini" id="editAuto">一键好看</button>
          <button class="mini" id="editZero">归零</button>
        </div>
        <div class="sliders" id="beautySliders"></div>
      </div>
      <div class="edit-sec">
        <div class="edit-hd"><b>氛围</b><i class="edit-gname" id="editGradeName">清透</i></div>
        <div class="moods compact" id="editPresets"></div>
        <div class="slider-row">
          <span>强度</span>
          <input type="range" id="editK" min="0" max="100" value="100">
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
